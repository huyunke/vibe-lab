<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171A">
<title>赛博回响：代码即律动</title>
<!--
  《赛博回响：代码即律动》
  创意 Coding · 代码音乐赛道
  全部音色由 Web Audio API 实时合成（振荡器、ADSR、梳状混响、乒乓延时），
  不加载任何外部音频文件。
-->
<style>
  :root {
    --bg: #14171A;
    --blue: #5B7B9E;
    --rose: #D4A5A5;
    --amber: #D08C45;
    --ink: #E7E1DA;
    --muted: #8E979F;
    --line: rgba(91, 123, 158, 0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  ::selection { background: rgba(212, 165, 165, 0.35); color: #fff; }

  #cv {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    max-width: 100%;
    display: grid;
    grid-template-rows: auto auto minmax(140px, 1fr) auto;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease 0.08s, transform 1s ease 0.08s;
    pointer-events: none;
    user-select: none;
    overflow: hidden;
  }
  .app.on {
    opacity: 1;
    transform: none;
  }
  .app.on .hit { pointer-events: auto; }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px 24px;
    flex-wrap: wrap;
    margin: 16px 22px 0;
    padding: 14px 18px;
    min-width: 0;
    border: 1px solid rgba(91, 123, 158, 0.28);
    border-radius: 18px;
    background: rgba(20, 23, 26, 0.55);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  }
  .brand {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .mark {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--amber);
    box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--blue), 0 0 16px rgba(208, 140, 69, 0.28);
    flex: none;
  }
  .brand h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
  }
  .brand p {
    margin: 4px 0 0;
    color: var(--muted);
    letter-spacing: 0.28em;
    font-size: 12px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid rgba(91, 123, 158, 0.35);
    background: rgba(20, 23, 26, 0.35);
    letter-spacing: 0.16em;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3c4450;
  }
  .dot.ready {
    background: var(--blue);
    box-shadow: 0 0 10px var(--blue);
  }
  .dot.live {
    background: var(--amber);
    box-shadow: 0 0 12px var(--amber);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { transform: scale(0.7); opacity: 0.55; }
  }

  .usage {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    min-width: 0;
    margin: 10px 22px 0;
    padding: 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.03em;
    line-height: 1.4;
  }
  .usage-item {
    display: inline-flex;
    align-items: center;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(91, 123, 158, 0.28);
    background: rgba(20, 23, 26, 0.42);
  }
  .usage-item em {
    font-style: normal;
    color: var(--amber);
    letter-spacing: 0.12em;
    margin-right: 6px;
  }
  .usage-item i {
    font-style: normal;
    color: var(--rose);
    margin-left: 6px;
  }

  .stage { position: relative; min-height: 0; min-width: 0; }
  .readout {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -52%);
    text-align: center;
    width: min(520px, 78vw);
    pointer-events: none;
  }
  .readout::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 42%;
    width: min(340px, 62vw);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20, 23, 26, 0.42) 0%, rgba(20, 23, 26, 0.08) 58%, transparent 72%);
    z-index: -1;
  }
  #heroMeta {
    display: inline-block;
    margin: 12px 0 0;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(91, 123, 158, 0.28);
    background: rgba(20, 23, 26, 0.35);
    color: var(--muted);
    letter-spacing: 0.16em;
    font-size: 12px;
  }
  #heroChord {
    margin: 0;
    font-family: "Cascadia Code", "Cascadia Mono", Consolas, "Sarasa Mono SC", monospace;
    font-weight: 400;
    font-size: clamp(28px, 4.6vw, 60px);
    letter-spacing: 0.12em;
    color: #f4eee8;
    text-shadow: 0 0 28px rgba(212, 165, 165, 0.28);
  }
  #heroChord.zh {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
  }

  .dock {
    margin: 0 22px 16px;
    padding: 14px 16px 16px;
    min-width: 0;
    border: 1px solid rgba(91, 123, 158, 0.28);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(20, 23, 26, 0.28), rgba(20, 23, 26, 0.72));
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
  }
  .transport {
    max-width: 1080px;
    margin: 0 auto 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(91, 123, 158, 0.18);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px 18px;
    flex-wrap: wrap;
  }
  .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    appearance: none;
    border: 1px solid rgba(91, 123, 158, 0.45);
    background: linear-gradient(180deg, rgba(42, 48, 56, 0.7), rgba(20, 23, 26, 0.55));
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    letter-spacing: 0.08em;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease, color 0.25s ease;
  }
  .btn:hover {
    border-color: var(--rose);
    color: white;
    transform: translateY(-1px);
  }
  .btn:focus-visible { outline: 1px solid var(--amber); outline-offset: 3px; }
  .btn .idx {
    color: var(--amber);
    margin-right: 6px;
    font-family: Consolas, monospace;
    letter-spacing: 0;
  }
  .btn.is-live {
    border-color: rgba(208, 140, 69, 0.85);
    background: rgba(208, 140, 69, 0.16);
    box-shadow: 0 0 22px rgba(208, 140, 69, 0.16);
  }
  .btn.ghost { color: var(--muted); }
  .tone-row {
    max-width: 1080px;
    margin: 0 auto 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .tone-label {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.16em;
    margin-right: 4px;
  }
  .slider {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.14em;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 112px;
    height: 2px;
    border-radius: 2px;
    background: rgba(91, 123, 158, 0.55);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--rose);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(212, 165, 165, 0.16);
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    background: var(--rose);
    cursor: pointer;
  }

  .piano-scroll { min-width: 0; overflow-x: auto; padding-bottom: 4px; }
  .piano-scroll::-webkit-scrollbar { height: 6px; }
  .piano-scroll::-webkit-scrollbar-thumb {
    background: rgba(91, 123, 158, 0.45);
    border-radius: 99px;
  }
  .piano {
    max-width: 1080px;
    min-width: 720px;
    margin: 0 auto;
    padding: 12px 14px 14px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(36, 42, 48, 0.55), rgba(16, 18, 21, 0.72));
    border: 1px solid rgba(212, 165, 165, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 10px 24px rgba(0, 0, 0, 0.2);
  }
  .piano-keys { position: relative; touch-action: none; }
  .whites {
    position: relative;
    display: flex;
    gap: 4px;
    height: clamp(112px, 16vh, 158px);
  }
  .blacks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .key {
    position: relative;
    appearance: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background 70ms linear, box-shadow 120ms ease;
  }
  .key:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; }
  .key.white {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(180deg, #4a525c 0%, #343b43 38%, #262c32 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -8px 10px rgba(0, 0, 0, 0.18);
    z-index: 1;
  }
  .key.black {
    position: absolute;
    top: 0;
    height: 62%;
    border-radius: 0 0 7px 7px;
    background: linear-gradient(180deg, #2a3036, #101316 70%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 10px 14px rgba(0, 0, 0, 0.4);
    z-index: 2;
    pointer-events: auto;
  }
  .key .face, .key .bind {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
    line-height: 1;
  }
  .key.white .face {
    bottom: 28px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: rgba(231, 225, 218, 0.42);
  }
  .key.white .bind {
    bottom: 10px;
    font-family: Consolas, monospace;
    font-size: 10px;
    color: rgba(91, 123, 158, 0.95);
  }
  .key.black .face {
    bottom: 18px;
    font-size: 10px;
    color: rgba(231, 225, 218, 0.72);
  }
  .key.black .bind {
    bottom: 6px;
    font-family: Consolas, monospace;
    font-size: 10px;
    color: rgba(212, 165, 165, 0.9);
  }
  .key.white.harm { box-shadow: inset 0 -3px 0 rgba(208, 140, 69, 0.75), inset 0 1px 0 rgba(255,255,255,0.08); }
  .key.black.harm { box-shadow: inset 0 -3px 0 rgba(208, 140, 69, 0.8), 0 8px 14px rgba(0,0,0,0.35); }
  .key.white.is-on {
    background: linear-gradient(180deg, #f3d7d7, #d4a5a5 58%, #c08f8f);
    box-shadow: 0 0 18px rgba(212, 165, 165, 0.55);
  }
  .key.black.is-on {
    background: linear-gradient(180deg, #9eb4cb, #5b7b9e 70%, #4d6b8c);
    box-shadow: 0 0 16px rgba(91, 123, 158, 0.65);
  }
  .key.is-on .face, .key.is-on .bind { color: #1a1714; }

  #gate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 50% 42%, rgba(91, 123, 158, 0.18), transparent 46%),
      radial-gradient(ellipse at 50% 70%, rgba(212, 165, 165, 0.08), transparent 40%),
      var(--bg);
    cursor: pointer;
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  #gate.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .halo {
    position: absolute;
    width: min(78vmin, 680px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid rgba(91, 123, 158, 0.38);
    animation: spin 42s linear infinite;
  }
  .halo::before, .halo::after {
    content: "";
    position: absolute;
    border-radius: 50%;
  }
  .halo::before {
    inset: 11%;
    border: 1px dashed rgba(212, 165, 165, 0.45);
  }
  .halo::after {
    inset: 23%;
    border: 1px solid rgba(208, 140, 69, 0.35);
  }
  .halo.alt {
    width: min(58vmin, 480px);
    border-style: dashed;
    border-color: rgba(208, 140, 69, 0.28);
    animation-direction: reverse;
    animation-duration: 58s;
  }
  .halo.alt::before, .halo.alt::after { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gate-card { position: relative; text-align: center; padding: 24px; }
  .eyebrow {
    margin: 0 0 18px;
    color: var(--blue);
    letter-spacing: 0.42em;
    font-size: 11px;
    text-indent: 0.42em;
  }
  .gate-card h1 {
    margin: 0;
    font-weight: 300;
    font-size: clamp(40px, 7vw, 84px);
    letter-spacing: 0.34em;
    text-indent: 0.34em;
  }
  .sub {
    margin: 12px 0 0;
    color: var(--rose);
    letter-spacing: 0.48em;
    text-indent: 0.48em;
    font-size: clamp(14px, 2vw, 18px);
  }
  .rule {
    width: min(280px, 60vw);
    height: 1px;
    margin: 26px auto;
    background: linear-gradient(90deg, transparent, var(--blue), var(--rose), var(--amber), transparent);
  }
  .cta {
    margin: 0;
    color: var(--amber);
    letter-spacing: 0.16em;
    font-size: 15px;
  }
  .caret {
    display: inline-block;
    width: 8px;
    height: 0.95em;
    margin-right: 8px;
    background: var(--amber);
    vertical-align: -2px;
    box-shadow: 0 0 12px rgba(208, 140, 69, 0.75);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .fine {
    margin: 18px 0 0;
    color: var(--muted);
    letter-spacing: 0.18em;
    font-size: 11px;
  }

  @media (max-width: 760px) {
    .top { margin: 10px 12px 0; padding: 12px 14px; }
    .brand h1 { letter-spacing: 0.18em; text-indent: 0.18em; font-size: 18px; }
    .dock { margin: 0 12px 12px; padding: 12px; }
    .usage { margin: 8px 12px 0; gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .halo, .dot.live, .caret { animation: none; }
  }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>

<div class="app" id="app" inert>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>赛博回响</h1>
        <p>代码即律动</p>
      </div>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">等待唤醒</span>
    </div>
  </header>

  <nav class="usage" aria-label="使用方式">
    <span class="usage-item"><em>白键</em>A S D F G H J K L ; ' Z X C V<i>C4–C6</i></span>
    <span class="usage-item"><em>黑键</em>W E T Y U O P 与 5 6 7<i>升号</i></span>
    <span class="usage-item"><em>和弦</em>可同时按住多个键</span>
    <span class="usage-item"><em>松开</em>音符自然释音</span>
    <span class="usage-item"><em>空格</em>播放 / 停止当前乐曲</span>
    <span class="usage-item"><em>鼠标</em>也可直接点按琴键</span>
  </nav>

  <main class="stage" id="stage">
    <div class="readout">
      <h2 id="heroChord" class="zh" aria-live="polite">赛博回响</h2>
      <p id="heroMeta">敲击琴键，或播放一段内置乐曲</p>
    </div>
  </main>

  <footer class="dock hit">
    <div class="transport">
      <div class="group">
        <button type="button" class="btn" id="btnAurora" aria-pressed="false"><span class="idx">01</span>播放晨雾</button>
        <button type="button" class="btn" id="btnHarbor" aria-pressed="false"><span class="idx">02</span>播放星港</button>
        <button type="button" class="btn" id="btnGolden" aria-pressed="false"><span class="idx">03</span>Golden Hour</button>
        <button type="button" class="btn" id="btnMystery" aria-pressed="false"><span class="idx">04</span>Mystery of Love</button>
        <button type="button" class="btn ghost" id="btnStop">停止</button>
      </div>
      <div class="group">
        <label class="slider">音量
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.82" aria-label="音量">
        </label>
        <label class="slider">空间
          <input id="space" type="range" min="0" max="1" step="0.01" value="0.64" aria-label="混响与延时">
        </label>
      </div>
    </div>
    <div class="tone-row" role="group" aria-label="音色">
      <span class="tone-label">音色</span>
      <button type="button" class="btn is-live" data-tone="piano" aria-pressed="true">钢琴</button>
      <button type="button" class="btn" data-tone="violin" aria-pressed="false">小提琴</button>
    </div>
    <div class="piano-scroll">
      <div class="piano" id="piano">
        <div class="piano-keys" id="pianoKeys">
          <div class="whites" id="whites"></div>
          <div class="blacks" id="blacks"></div>
        </div>
      </div>
    </div>
  </footer>
</div>

<div id="gate" role="button" tabindex="0" aria-label="点击任意位置激活灵感外挂">
  <div class="halo" aria-hidden="true"></div>
  <div class="halo alt" aria-hidden="true"></div>
  <div class="gate-card">
    <p class="eyebrow">CREATIVE CODING · AUDIO</p>
    <h1>赛博回响</h1>
    <p class="sub">代码即律动</p>
    <div class="rule"></div>
    <p class="cta"><span class="caret" aria-hidden="true"></span><span id="ctaText">点击任意位置激活灵感外挂</span></p>
    <p class="fine">WEB AUDIO · OSCILLATOR · ADSR · REVERB · DELAY</p>
  </div>
</div>

<script>
(() => {
  'use strict';

  // 音名与频率：C4 的 MIDI 为 60，A4 = 440Hz
  const SEMI = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const NOTE_FREQ = {};
  const NOTE_MIDI = {};
  for (let midi = 36; midi <= 96; midi++) {
    const name = SEMI[midi % 12] + (Math.floor(midi / 12) - 1);
    NOTE_FREQ[name] = 440 * Math.pow(2, (midi - 69) / 12);
    NOTE_MIDI[name] = midi;
  }
  const PIANO = [];
  for (let midi = 60; midi <= 84; midi++) {
    PIANO.push(SEMI[midi % 12] + (Math.floor(midi / 12) - 1));
  }

  // 电脑键盘到音符。用 e.code，不随中文输入法改变
  const KEY_TO_NOTE = {
    KeyA: 'C4', KeyW: 'C#4', KeyS: 'D4', KeyE: 'D#4', KeyD: 'E4',
    KeyF: 'F4', KeyT: 'F#4', KeyG: 'G4', KeyY: 'G#4', KeyH: 'A4',
    KeyU: 'A#4', KeyJ: 'B4', KeyK: 'C5', KeyO: 'C#5', KeyL: 'D5',
    KeyP: 'D#5', Semicolon: 'E5', Quote: 'F5', Digit5: 'F#5',
    KeyZ: 'G5', Digit6: 'G#5', KeyX: 'A5', Digit7: 'A#5', KeyC: 'B5', KeyV: 'C6'
  };
  const NOTE_BIND = {
    C4: 'A', 'C#4': 'W', D4: 'S', 'D#4': 'E', E4: 'D', F4: 'F', 'F#4': 'T',
    G4: 'G', 'G#4': 'Y', A4: 'H', 'A#4': 'U', B4: 'J', C5: 'K', 'C#5': 'O',
    D5: 'L', 'D#5': 'P', E5: ';', F5: "'", 'F#5': '5', G5: 'Z', 'G#5': '6',
    A5: 'X', 'A#5': '7', B5: 'C', C6: 'V'
  };

  // 钢琴音色的各声部包络。attack / decay / sustain / release 单位为秒
  const PRESETS = {
    pad: {
      a: 'sine', b: 'triangle', mixA: 0.62, mixB: 0.3, detune: 8,
      attack: 0.24, decay: 0.5, sustain: 0.8, release: 1.25,
      f0: 280, f1: 1200, q: 0.55, gain: 0.09, noise: 0.018

  // 把以拍为单位的事件放进等分格子，供调度器按拍取用
  function makeSong(def) {
    const events = [];
    const add = (beat, notes, dur, vel, preset) => {
      (Array.isArray(notes) ? notes : [notes]).forEach((note) => {
        events.push({ beat, note, dur, vel, preset });
      });
    };
    def.build(add);
    const grid = def.grid || 2;
    const steps = def.bars * 4 * grid;
    const buckets = Array.from({ length: steps }, () => []);
    events.forEach((ev) => {
      const step = Math.round(ev.beat * grid);
      if (step >= 0 && step < steps) buckets[step].push(ev);
    });
    return {
      id: def.id,
      title: def.title,
      bpm: def.bpm,
      bars: def.bars,
      grid,
      progression: def.progression,
      chords: def.chords,
      buckets,
      steps
    };
  }

  // 三个音以上时，按音程模板判断和弦名
  function detectChord(notes) {
    const midis = notes.map((n) => NOTE_MIDI[n]).sort((a, b) => a - b);
    const pcs = [...new Set(midis.map((m) => ((m % 12) + 12) % 12))];
    const bass = ((midis[0] % 12) + 12) % 12;
    let best = null;
    for (let root = 0; root < 12; root++) {
      const rel = new Set(pcs.map((pc) => (pc - root + 12) % 12));
      for (const type of CHORD_TYPES) {
        if (!type.iv.every((i) => rel.has(i))) continue;
        const score = type.iv.length + (root === bass ? 0.25 : 0);
        if (!best || score > best.score) best = { root, sym: type.sym, score };
      }
    }
    if (!best) return notes.map(prettyNote).join(' · ');
    return PC_NAME[best.root] + best.sym;
  }

  // ADSR。增益不能从 0 做指数渐变，所以最低用 0.0001，避免爆音
  function scheduleGain(param, when, peak, preset, durSec) {
    const attack = preset.attack;
    const decay = preset.decay;
    const release = preset.release;
    const safePeak = Math.max(peak, 0.0002);
    const sustain = Math.max(0.0001, peak * preset.sustain);
    param.cancelScheduledValues(when);
    param.setValueAtTime(0.0001, when);

    if (preset.sustain <= 0.001) {
      const a = Math.max(0.005, attack);
      param.exponentialRampToValueAtTime(safePeak, when + a);
      const end = when + a + decay + release;
      param.exponentialRampToValueAtTime(0.0001, end);
      return end + 0.05;
    }

    if (durSec == null) {
      param.exponentialRampToValueAtTime(safePeak, when + attack);
      if (safePeak - sustain > 0.0002) {
        param.exponentialRampToValueAtTime(sustain, when + attack + decay);
      }
      return Infinity;
    }

    if (durSec < attack + decay + 0.03) {
      const a = Math.max(0.006, Math.min(attack, durSec * 0.45));
      param.exponentialRampToValueAtTime(safePeak, when + a);
      const end = when + Math.max(durSec, a + 0.02) + release;
      param.exponentialRampToValueAtTime(0.0001, end);
      return end + 0.05;
    }

    param.exponentialRampToValueAtTime(safePeak, when + attack);
    const decayEnd = when + attack + decay;
    if (safePeak - sustain > 0.0002) param.exponentialRampToValueAtTime(sustain, decayEnd);
    const relStart = when + durSec;
    param.setValueAtTime(sustain, relStart);
    const end = relStart + release;
    param.exponentialRampToValueAtTime(0.0001, end);
    return end + 0.05;
  }

  function disconnectVoice(voice) {
    if (!voice || voice.disconnected) return;
    voice.disconnected = true;
    voice.nodes.forEach((node) => { try { node.disconnect(); } catch (e) { /* already gone */ } });
  }

  function killVoice(voice, release) {
    if (!voice || voice.dead || !ctx) return;
    voice.dead = true;
    const now = ctx.currentTime;
    if (voice.when > now + 0.012) {
      try {
        voice.gain.gain.cancelScheduledValues(0);
        voice.gain.gain.setValueAtTime(0.0001, now);
      } catch (e) { /* param may already be closed */ }
      voice.oscs.forEach((osc) => { try { osc.stop(voice.when); } catch (e) { /* not started */ } });
      setTimeout(() => disconnectVoice(voice), 60);
      return;
    }
    const rel = release == null ? (voice.release || 0.8) : release;
    const t = now + 0.012;
    const gain = voice.gain.gain;
    let current = 0.0001;
    try { current = Math.max(gain.value, 0.0001); } catch (e) { current = 0.0001; }
    try {
      gain.cancelScheduledValues(t);
      gain.setValueAtTime(current, t);
      gain.exponentialRampToValueAtTime(0.0001, t + rel);
    } catch (e) { /* envelope race */ }
    const stopAt = t + rel + 0.06;
    voice.oscs.forEach((osc) => { try { osc.stop(stopAt); } catch (e) { /* stop already queued */ } });
    voice.stopAt = stopAt;
    setTimeout(() => disconnectVoice(voice), (rel + 0.15) * 1000);
  }

  function makeNoiseBuffer(audioCtx) {
    const length = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last;
    }
    let max = 0.0001;
    for (let i = 0; i < length; i++) max = Math.max(max, Math.abs(data[i]));
    for (let i = 0; i < length; i++) data[i] = data[i] / max * 0.85;
    return buffer;
  }

  // 梳状滤波混响：多条延迟反馈，不加载采样脉冲
  function createReverb(audioCtx) {
    const input = audioCtx.createGain();
    const pre = audioCtx.createDelay(0.2);
    pre.delayTime.value = 0.026;
    const tone = audioCtx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 4200;
    input.connect(pre);
    pre.connect(tone);

    const sum = audioCtx.createGain();
    sum.gain.value = 0.2;
    [0.0297, 0.0371, 0.0411, 0.0437, 0.053].forEach((time, i) => {
      const delay = audioCtx.createDelay(1);
      delay.delayTime.value = time;
      const feedback = audioCtx.createGain();
      feedback.gain.value = 0.64 + (i % 3) * 0.03;
      const damp = audioCtx.createBiquadFilter();
      damp.type = 'lowpass';
      damp.frequency.value = 1900 + i * 180;
      tone.connect(delay);
      delay.connect(damp);
      damp.connect(feedback);
      feedback.connect(delay);
      damp.connect(sum);
    });

    const output = audioCtx.createGain();
    let node = sum;
    [0.0051, 0.0127].forEach((time) => {
      const allIn = audioCtx.createGain();
      const allOut = audioCtx.createGain();
      const delay = audioCtx.createDelay(1);
      delay.delayTime.value = time;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.68;
      const ff = audioCtx.createGain();
      ff.gain.value = -0.68;
      allIn.connect(delay);
      allIn.connect(ff);
      delay.connect(allOut);
      delay.connect(fb);
      fb.connect(delay);
      ff.connect(allOut);
      node.connect(allIn);
      node = allOut;
    });
    node.connect(output);
    return { input, output };
  }

  // 左右交替的乒乓延时
  function createPingPong(audioCtx) {
    const input = audioCtx.createGain();
    const output = audioCtx.createGain();
    const d1 = audioCtx.createDelay(1.5);
    const d2 = audioCtx.createDelay(1.5);
    d1.delayTime.value = 0.26;
    d2.delayTime.value = 0.39;
    const f1 = audioCtx.createGain();
    const f2 = audioCtx.createGain();
    f1.gain.value = 0.34;
    f2.gain.value = 0.3;
    const lp1 = audioCtx.createBiquadFilter();
    const lp2 = audioCtx.createBiquadFilter();
    lp1.type = 'lowpass';
    lp2.type = 'lowpass';
    lp1.frequency.value = 2400;
    lp2.frequency.value = 1900;
    const p1 = audioCtx.createStereoPanner();
    const p2 = audioCtx.createStereoPanner();
    p1.pan.value = -0.62;
    p2.pan.value = 0.62;
    input.connect(d1);
    d1.connect(lp1);
    lp1.connect(f1);
    f1.connect(d2);
    d2.connect(lp2);
    lp2.connect(f2);
    f2.connect(d1);
    lp1.connect(p1);
    lp2.connect(p2);
    p1.connect(output);
    p2.connect(output);
    return { input, output };
  }

  // 轻微合唱，让合成音色更宽
  function createChorus(audioCtx) {
    const input = audioCtx.createGain();
    const output = audioCtx.createGain();
    const dry = audioCtx.createGain();
    dry.gain.value = 1;
    input.connect(dry);
    dry.connect(output);
    [0.0125, 0.0185].forEach((base, i) => {
      const delay = audioCtx.createDelay(0.05);
      delay.delayTime.value = base;
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.16 + i * 0.07;
      const depth = audioCtx.createGain();
      depth.gain.value = 0.0024;
      lfo.connect(depth);
      depth.connect(delay.delayTime);
      lfo.start();
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = i === 0 ? -0.45 : 0.45;
      const wet = audioCtx.createGain();
      wet.gain.value = 0.16;
      input.connect(delay);
      delay.connect(pan);
      pan.connect(wet);
      wet.connect(output);
    });
    return { input, output };
  }

  function setVolume(value) {
    if (!masterGain || !ctx) return;
    masterGain.gain.setTargetAtTime(clamp(Number(value), 0, 1) * 0.9, ctx.currentTime, 0.03);
  }

  function setSpace(value) {
    if (!reverbSend || !ctx) return;
    const v = clamp(Number(value), 0, 1);
    const t = ctx.currentTime;
    reverbSend.gain.setTargetAtTime(0.1 + v * 0.78, t, 0.04);
    delaySend.gain.setTargetAtTime(0.03 + v * 0.34, t, 0.04);
  }

  // 必须在用户点击后调用，否则浏览器会拦住自动发声
  function buildGraph() {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });
    ctx.resume();

    voiceBus = ctx.createGain();
    voiceBus.gain.value = 1;

    const reverb = createReverb(ctx);
    const ping = createPingPong(ctx);
    reverbSend = ctx.createGain();
    delaySend = ctx.createGain();
    const sum = ctx.createGain();
    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 32;
    const soften = ctx.createBiquadFilter();
    soften.type = 'lowpass';
    soften.frequency.value = 12000;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20;
    comp.knee.value = 18;
    comp.ratio.value = 2.4;
    comp.attack.value = 0.008;
    comp.release.value = 0.28;
    masterGain = ctx.createGain();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.72;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);

    voiceBus.connect(chorus.input);
    chorus.output.connect(sum);
    voiceBus.connect(reverbSend);
    voiceBus.connect(delaySend);
    reverbSend.connect(reverb.input);
    delaySend.connect(ping.input);
    reverb.output.connect(sum);
    ping.output.connect(sum);
    sum.connect(highpass);
    highpass.connect(soften);
    soften.connect(comp);
    comp.connect(masterGain);
    masterGain.connect(analyser);
    analyser.connect(ctx.destination);

    noiseSource = ctx.createBufferSource();
    noiseSource.buffer = makeNoiseBuffer(ctx);
    noiseSource.loop = true;
    const airFilter = ctx.createBiquadFilter();
    airFilter.type = 'bandpass';
    airFilter.frequency.value = 740;
    airFilter.Q.value = 0.65;
    airGain = ctx.createGain();
    airGain.gain.value = 0.0001;
    noiseSource.connect(airFilter);
    airFilter.connect(airGain);
    airGain.connect(reverb.input);
    noiseSource.start();

    setVolume(volumeEl.value);
    setSpace(spaceEl.value);
  }

  // 发一个音：双振荡器 + 低通 + ADSR，再送入混响和延时
  function startVoice(note, presetName, velocity, when, durSec) {
    const preset = resolvePreset(presetName);
    const freq = NOTE_FREQ[note];
    if (!preset || !freq || !ctx) return null;
    when = when == null ? ctx.currentTime : when;
    velocity = clamp(velocity, 0.04, 1);

    const oscs = [];
    const nodes = [];
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.setValueAtTime(preset.q || 0.7, when);
    const openAt = when + Math.max(0.02, preset.attack);
    const bodyF = preset.track ? Math.min(7600, Math.max(220, freq * preset.track)) : preset.f1;
    const startF = preset.track ? Math.min(bodyF * 0.98, Math.max(90, freq * (preset.trackStart || 1.5))) : preset.f0;
    const openF = Math.max(startF * 1.03, bodyF);
    filter.frequency.setValueAtTime(Math.max(40, startF), when);
    filter.frequency.exponentialRampToValueAtTime(Math.max(80, openF), openAt);
    if (durSec != null && durSec > preset.attack + 0.05) {
      filter.frequency.setValueAtTime(Math.max(80, bodyF), when + durSec);
      filter.frequency.exponentialRampToValueAtTime(
        Math.max(70, startF * 0.85),
        when + durSec + preset.release * 0.75
      );
    }

    const vca = ctx.createGain();
    const stopAt = scheduleGain(vca.gain, when, preset.gain * velocity, preset, durSec);
    filter.connect(vca);
    vca.connect(voiceBus);
    nodes.push(filter, vca);

    const drift = (presetName === 'pad' ? 8 : 3) * (Math.random() - 0.5);
    const oscA = ctx.createOscillator();
    const oscB = ctx.createOscillator();
    oscA.type = preset.a;
    oscB.type = preset.b;
    oscA.frequency.setValueAtTime(freq, when);
    oscA.detune.setValueAtTime(drift, when);
    if (preset.bRatio) {
      oscB.frequency.setValueAtTime(freq * preset.bRatio, when);
    } else {
      oscB.frequency.setValueAtTime(freq, when);
      oscB.detune.setValueAtTime((preset.detune || 0) + drift, when);
    }
    const gA = ctx.createGain();
    const gB = ctx.createGain();
    gA.gain.value = preset.mixA;
    gB.gain.value = preset.mixB;
    oscA.connect(gA); gA.connect(filter);
    oscB.connect(gB); gB.connect(filter);
    oscA.start(when);
    oscB.start(when);
    oscs.push(oscA, oscB);
    nodes.push(oscA, oscB, gA, gB);

    if (preset.sub && freq < 430) {
      const sub = ctx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(freq / 2, when);
      const sg = ctx.createGain();
      sg.gain.value = preset.sub;
      sub.connect(sg); sg.connect(filter);
      sub.start(when);
      oscs.push(sub);
      nodes.push(sub, sg);
    }

    if (preset.partial) {
      const partial = ctx.createOscillator();
      partial.type = 'sine';
      partial.frequency.setValueAtTime(freq * (preset.partialRatio || 2), when);
      const pg = ctx.createGain();
      pg.gain.value = preset.partial;
      partial.connect(pg); pg.connect(filter);
      partial.start(when);
      oscs.push(partial);
      nodes.push(partial, pg);
    }

    if (preset.noise && noiseSource) {
      const ng = ctx.createGain();
      const air = Math.max(0.0004, preset.noise * velocity);
      const breath = ctx.createBiquadFilter();
      breath.type = 'bandpass';
      breath.frequency.setValueAtTime(Math.min(4200, Math.max(900, freq * 2.5)), when);
      breath.Q.value = 0.8;
      if (preset.chiff) {
        ng.gain.setValueAtTime(Math.max(0.001, preset.chiff * velocity), when);
        ng.gain.exponentialRampToValueAtTime(air, when + 0.14);
      } else {
        ng.gain.value = air;
      }
      noiseSource.connect(breath);
      breath.connect(ng);
      ng.connect(preset.noiseAir ? vca : filter);
      nodes.push(ng, breath);
    }

    if (preset.vibrato) {
      const lfo = ctx.createOscillator();
      lfo.frequency.setValueAtTime(preset.vibratoRate || 4.4, when);
      const lg = ctx.createGain();
      lg.gain.setValueAtTime(0.001, when);
      lg.gain.linearRampToValueAtTime(preset.vibrato, when + (preset.vibratoDelay || 0.38));
      lfo.connect(lg);
      lg.connect(oscA.detune);
      if (!preset.bRatio) lg.connect(oscB.detune);
      lfo.start(when);
      oscs.push(lfo);
      nodes.push(lfo, lg);
    }

    if (Number.isFinite(stopAt)) {
      oscs.forEach((osc) => { try { osc.stop(stopAt); } catch (e) { /* ignore */ } });
    }

    const voice = { oscs, nodes, gain: vca, when, stopAt, release: preset.release, dead: false, disconnected: false };
    if (Number.isFinite(stopAt)) {
      const wait = Math.max(40, (stopAt - ctx.currentTime) * 1000 + 80);
      setTimeout(() => disconnectVoice(voice), wait);
    }
    return voice;
  }

  // 用音频时钟提前排音，界面时钟只负责画，避免节奏漂移
  const transport = {
    playing: false,
    song: null,
    timer: null,
    nextTime: 0,
    step: 0,
    stepDur: 0,
    startTime: 0,
    total: 0,
    voices: [],

    start(song) {
      if (!ctx) return;
      this.stop();
      this.song = song;
      lastSongId = song.id;
      this.stepDur = (60 / song.bpm) / (song.grid || 2);
      this.total = song.steps;
      this.step = 0;
      this.startTime = ctx.currentTime + 0.07;
      this.nextTime = this.startTime;
      this.playing = true;
      airGain.gain.setTargetAtTime(0.022, ctx.currentTime, 0.6);
      this.tick();
    },

    stop() {
      this.playing = false;
      if (this.timer) clearTimeout(this.timer);
      this.timer = null;
      const voices = this.voices.splice(0);
      voices.forEach((voice) => killVoice(voice, 0.34));
      seqVisual.length = 0;
      pendingFx.length = 0;
      if (airGain && ctx) airGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.35);
    },

    tick() {
      if (!this.playing || !ctx) return;
      const now = ctx.currentTime;
      if (this.nextTime < now - 0.08) {
        const skip = Math.ceil((now - 0.02 - this.nextTime) / this.stepDur);
        this.step = (this.step + skip) % this.total;
        this.nextTime += skip * this.stepDur;
      }
      const horizon = now + 0.16;
      let guard = 0;
      while (this.nextTime < horizon && guard++ < 48) {
        const bucket = this.song.buckets[this.step] || [];
        const beatSec = 60 / this.song.bpm;
        for (const ev of bucket) {
          const durSec = ev.dur * beatSec;
          const vel = clamp(ev.vel * (0.94 + Math.random() * 0.1), 0.04, 1);
          try {
            const voice = startVoice(ev.note, ev.preset, vel, this.nextTime, durSec);
            if (voice) this.voices.push(voice);
            seqVisual.push({ note: ev.note, until: this.nextTime + durSec });
            if (ev.preset !== 'pad') pendingFx.push({ at: this.nextTime, kind: ev.preset });
          } catch (err) {
            console.error(err);
          }
        }
        this.nextTime += this.stepDur;
        this.step = (this.step + 1) % this.total;
      }
      const keepAfter = ctx.currentTime - 0.3;
      this.voices = this.voices.filter((voice) => voice && !voice.dead && voice.stopAt > keepAfter);
      this.timer = setTimeout(() => this.tick(), 25);
    },

    position() {
      if (!this.playing || !ctx) return 0;
      const loop = this.total * this.stepDur;
      const elapsed = ctx.currentTime - this.startTime;
      if (elapsed <= 0 || loop <= 0) return 0;
      return (elapsed % loop) / loop;
    },

    beat() {
      if (!this.song) return 0;
      return this.position() * this.song.bars * 4;
    }
  };

  function currentChord() {
    if (!transport.playing || !transport.song) return null;
    const beat = transport.beat();
    return transport.song.chords.find((chord) => beat >= chord.from && beat < chord.to) || transport.song.chords[0];
  }

  function poke(amount) {
    transient = Math.min(1, transient + amount);
  }

  function faceOf(name) {
    if (/^C\d/.test(name)) return prettyNote(name);
    return prettyNote(name).replace(/\d/, '');
  }

  function buildPiano() {
    const whites = PIANO.filter((name) => !name.includes('#'));
    const blacks = PIANO.filter((name) => name.includes('#'));
    const anchors = blacks.map((name) => whites.findIndex((white) => NOTE_MIDI[white] === NOTE_MIDI[name] - 1));
    pianoKeys._anchors = anchors;

    const makeKey = (name, black) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = black ? 'key black' : 'key white';
      button.dataset.note = name;
      button.setAttribute('aria-label', prettyNote(name) + (NOTE_BIND[name] ? '，键位 ' + NOTE_BIND[name] : ''));
      button.innerHTML = `<span class="face">${faceOf(name)}</span><span class="bind">${NOTE_BIND[name] || ''}</span>`;
      keyEls.set(name, button);
      return button;
    };

    whites.forEach((name) => whitesEl.appendChild(makeKey(name, false)));
    blacks.forEach((name) => blacksEl.appendChild(makeKey(name, true)));
    blacksEl.style.visibility = 'hidden';
    layoutBlacks();
    blacksEl.style.visibility = 'visible';
  }

  function layoutBlacks() {
    const whiteEls = [...whitesEl.children];
    const blackEls = [...blacksEl.children];
    const anchors = pianoKeys._anchors || [];
    blackEls.forEach((el, i) => {
      const anchor = whiteEls[anchors[i]];
      const next = whiteEls[anchors[i] + 1];
      if (!anchor || !next) return;
      const width = anchor.offsetWidth * 0.58;
      const mid = (anchor.offsetLeft + anchor.offsetWidth + next.offsetLeft) / 2;
      el.style.width = width + 'px';
      el.style.left = (mid - width / 2) + 'px';
    });
  }

  // 同一个音可以被键盘和鼠标同时按住，全部松开才释音
  function manualOn(note, source) {
    let slot = manual.get(note);
    if (!slot) {
      slot = { sources: new Set(), voice: null };
      manual.set(note, slot);
    }
    if (slot.sources.has(source)) return;
    const fresh = slot.sources.size === 0;
    slot.sources.add(source);
    if (!fresh) return;
    slot.voice = startVoice(note, 'key', 0.9, ctx.currentTime, null);
    poke(0.5);
    const origin = keyOrigin(note);
    const color = note.includes('#') ? '91,123,158' : '212,165,165';
    burst(origin.x, origin.y, 11, 1.55, color);
    ripples.push({ x: origin.x, y: origin.y, t: performance.now(), color });
  }

  function manualOff(note, source) {
    const slot = manual.get(note);
    if (!slot || !slot.sources.has(source)) return;
    slot.sources.delete(source);
    if (slot.sources.size > 0) return;
    killVoice(slot.voice);
    manual.delete(note);
  }

  function releaseAllManual() {
    for (const [note, slot] of [...manual.entries()]) {
      slot.sources.clear();
      killVoice(slot.voice);
      manual.delete(note);
    }
    pointerNote.clear();
  }

  function endPointer(e) {
    if (!pointerNote.has(e.pointerId)) return;
    const prev = pointerNote.get(e.pointerId);
    pointerNote.delete(e.pointerId);
    if (prev) manualOff(prev, 'p' + e.pointerId);
  }

  // 第一次点击时创建 AudioContext，并揭开进入页
  function bootFromGesture() {
    if (audioReady || booting) return;
    booting = true;
    try {
      if (!ctx) buildGraph();
      audioReady = true;
    } catch (err) {
      booting = false;
      console.error(err);
      ctaText.textContent = '音频启动失败，请再次点击';
      return;
    }
    gate.classList.add('hide');
    gate.setAttribute('aria-hidden', 'true');
    app.inert = false;
    app.classList.add('on');
    statusText.textContent = '合成器已就绪';
    dot.classList.add('ready');
    requestAnimationFrame(layoutBlacks);
  }

  function toggleSong(id) {
    if (!audioReady) return;
    if (transport.playing && transport.song && transport.song.id === id) {
      transport.stop();
      return;
    }
    transport.start(SONGS[id]);
  }

  function syncKeys() {
    const now = ctx ? ctx.currentTime : 0;
    const exact = new Set(manual.keys());
    if (seqVisual.length > 240) {
      for (let i = seqVisual.length - 1; i >= 0; i--) {
        if (seqVisual[i].until < now - 0.4) seqVisual.splice(i, 1);
      }
    }
    for (const item of seqVisual) {
      if (item.until > now && keyEls.has(item.note)) exact.add(item.note);
    }
    const chord = currentChord();
    const tones = new Set(chord ? chord.tones : []);
    const sig = (chord ? chord.name : '-') + '|' + [...exact].sort().join(',');
    if (sig === keySig) return;
    keySig = sig;
    for (const [name, el] of keyEls) {
      const on = exact.has(name);
      el.classList.toggle('is-on', on);
      el.classList.toggle('harm', !on && tones.has(name.slice(0, -1)));
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function syncHud() {
    const manualNotes = [...manual.keys()].sort((a, b) => NOTE_MIDI[a] - NOTE_MIDI[b]);
    let hero = '赛博回响';
    let meta = '敲击琴键，或播放一段内置乐曲';
    let zh = true;
    let status = audioReady ? '合成器已就绪' : '等待唤醒';
    let live = false;

    if (manualNotes.length === 1) {
      hero = prettyNote(manualNotes[0]);
      meta = NOTE_FREQ[manualNotes[0]].toFixed(2) + ' Hz · 松开后自然释音';
      zh = false;
      status = '手动演奏';
    } else if (manualNotes.length === 2) {
      hero = manualNotes.map(prettyNote).join('  ·  ');
      meta = '双音 · 可继续叠加成和弦';
      zh = false;
      status = '手动演奏';
    } else if (manualNotes.length >= 3) {
      hero = detectChord(manualNotes);
      meta = manualNotes.map(prettyNote).join('  ');
      zh = false;
      status = '手动和弦';
    } else if (transport.playing && transport.song) {
      const chord = currentChord();
      const beat = transport.beat();
      const bar = clamp(Math.floor(beat / 4) + 1, 1, transport.song.bars);
      hero = chord.name;
      meta = transport.song.title + ' · ' + transport.song.bpm + ' BPM · 第 ' + bar + ' 小节';
      zh = false;
      status = '正在演奏 · ' + transport.song.title;
      live = true;
    }

    const sig = hero + '|' + meta + '|' + status;
    if (sig === hudSig) return;
    hudSig = sig;
    heroChord.textContent = hero;
    heroChord.classList.toggle('zh', zh);
    heroMeta.textContent = meta;
    if (audioReady || status !== '等待唤醒') statusText.textContent = status;
    dot.classList.toggle('live', live);
    const auroraOn = transport.playing && transport.song && transport.song.id === 'aurora';
    const harborOn = transport.playing && transport.song && transport.song.id === 'harbor';
    const goldenOn = transport.playing && transport.song && transport.song.id === 'golden';
    const mysteryOn = transport.playing && transport.song && transport.song.id === 'mystery';
    btnAurora.classList.toggle('is-live', auroraOn);
    btnHarbor.classList.toggle('is-live', harborOn);
    btnGolden.classList.toggle('is-live', goldenOn);
    btnMystery.classList.toggle('is-live', mysteryOn);
    btnAurora.setAttribute('aria-pressed', auroraOn ? 'true' : 'false');
    btnHarbor.setAttribute('aria-pressed', harborOn ? 'true' : 'false');
    btnGolden.setAttribute('aria-pressed', goldenOn ? 'true' : 'false');
    btnMystery.setAttribute('aria-pressed', mysteryOn ? 'true' : 'false');
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(viewW * dpr));
    canvas.height = Math.max(1, Math.floor(viewH * dpr));
    if (!stars.length && viewW > 0) {
      for (let i = 0; i < 72; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          r: Math.random() * 1.25 + 0.25,
          p: Math.random() * Math.PI * 2,
          c: Math.random() > 0.72 ? '212,165,165' : '91,123,158'
        });
      }
    }
    if (particles.filter((p) => p.dust).length < 40 && viewW > 0) {
      for (let i = 0; i < 56; i++) particles.push(makeDust(true));
    }
    layoutBlacks();
  }

  function center() {
    const rect = stage.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2,
      w: rect.width,
      h: rect.height,
      bottom: rect.bottom
    };
  }

  function keyOrigin(note) {
    const el = keyEls.get(note);
    if (!el) return { x: viewW / 2, y: viewH / 2 };
    const rect = el.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + 2 };
  }

  function makeDust(anywhere) {
    return {
      x: Math.random() * (viewW || 1),
      y: anywhere ? Math.random() * (viewH || 1) : (viewH || 1) + 8,
      vx: (Math.random() - 0.5) * 0.16,
      vy: -0.06 - Math.random() * 0.16,
      life: 0.35 + Math.random() * 0.65,
      decay: 0.0007 + Math.random() * 0.0012,
      r: 0.4 + Math.random() * 1.5,
      color: Math.random() > 0.55 ? '91,123,158' : '212,165,165',
      dust: true
    };
  }

  function burst(x, y, count, speed, color) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const mag = speed * (0.35 + Math.random() * 0.75);
      particles.push({
        x, y,
        vx: Math.cos(angle) * mag,
        vy: Math.sin(angle) * mag - 0.2,
        life: 1,
        decay: 0.012 + Math.random() * 0.016,
        r: 1 + Math.random() * 2.3,
        color,
        dust: false
      });
    }
    if (particles.length > 260) {
      for (let i = 0; i < particles.length && particles.length > 210; i++) {
        if (!particles[i].dust) particles.splice(i, 1);
      }
    }
  }

  function emitFx(kind) {
    if (kind === 'arp') {
      burst(frameCx, frameCy, 2, 0.75, '91,123,158');
      poke(0.1);
    } else if (kind === 'lead') {
      burst(frameCx, frameCy, 5, 1.2, '212,165,165');
      poke(0.2);
    } else if (kind === 'bell') {
      burst(frameCx, frameCy, 8, 1.65, '208,140,69');
      poke(0.28);
    } else if (kind === 'bass') {
      poke(0.16);
    }
  }

  function mixColor(t, amp) {
    const amber = [208, 140, 69];
    const blue = [91, 123, 158];
    const rose = [212, 165, 165];
    const pick = (a, b, u) => [
      a[0] + (b[0] - a[0]) * u,
      a[1] + (b[1] - a[1]) * u,
      a[2] + (b[2] - a[2]) * u
    ];
    const rgb = t < 0.5 ? pick(amber, blue, t / 0.5) : pick(blue, rose, (t - 0.5) / 0.5);
    const alpha = 0.22 + amp * 0.78;
    return 'rgba(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ',' + alpha.toFixed(3) + ')';
  }

  function drawPolar(data, radius, amp, color, width, shift, fill) {
    const n = 168;
    g.beginPath();
    for (let i = 0; i <= n; i++) {
      const idx = Math.floor((((i + shift) % n) / n) * (data ? data.length : n));
      let sample;
      if (data) {
        sample = (data[idx] - 128) / 128;
        sample = sample * (0.55 + viewEnergy * 1.7) + Math.sin(performance.now() / 900 + i * 0.11) * 0.045;
      } else {
        sample = Math.sin(performance.now() / 800 + i * 0.16) * 0.16;
      }
      const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
      const r = radius + sample * amp;
      const x = frameCx + Math.cos(angle) * r;
      const y = frameCy + Math.sin(angle) * r;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.closePath();
    if (fill) {
      g.fillStyle = fill;
      g.fill();
    }
    g.strokeStyle = color;
    g.lineWidth = width;
    g.stroke();
  }

  // 每帧绘制背景、整圈频谱和波形。频谱重复铺满圆环
  function draw(now) {
    if (!viewW || !viewH) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#14171A';
    g.fillRect(0, 0, viewW, viewH);

    const stageBox = center();
    frameCx = stageBox.x;
    frameCy = stageBox.y;
    baseR = clamp(Math.min(stageBox.w, stageBox.h) * 0.27, 68, 188);

    const t = now / 1000;
    const blob = (x, y, r, color) => {
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, color);
      grd.addColorStop(1, 'rgba(20,23,26,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    };
    blob(viewW * (0.22 + Math.sin(t * 0.13) * 0.04), viewH * 0.32, viewW * 0.28, 'rgba(91,123,158,0.16)');
    blob(viewW * (0.78 + Math.cos(t * 0.11) * 0.03), viewH * 0.62, viewW * 0.24, 'rgba(212,165,165,0.09)');
    blob(frameCx, frameCy, baseR * 1.4, 'rgba(208,140,69,0.05)');

    for (const star of stars) {
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.8 + star.p));
      g.fillStyle = 'rgba(' + star.c + ',' + (0.12 + tw * 0.38).toFixed(3) + ')';
      g.beginPath();
      g.arc(star.x * viewW, star.y * viewH, star.r, 0, Math.PI * 2);
      g.fill();
    }

    if (ctx && analyser) {
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);
      let sq = 0;
      for (let i = 0; i < timeData.length; i++) {
        const v = (timeData[i] - 128) / 128;
        sq += v * v;
      }
      const rms = Math.sqrt(sq / timeData.length);
      const bands = 32;
      const bandAmp = new Float32Array(bands);
      for (let b = 0; b < bands; b++) {
        const curve = Math.pow((b + 0.5) / bands, 1.05);
        const idx = Math.min(freqData.length - 1, Math.floor(curve * freqData.length * 0.55));
        const spread = (freqData[idx] + (freqData[Math.min(freqData.length - 1, idx + 1)] || 0)) / 2 / 255;
        bandAmp[b] = spread;
      }
      for (let i = 0; i < smooth.length; i++) {
        const around = (i / smooth.length) * 4;
        const phase = around - Math.floor(around);
        const b0 = Math.floor(phase * bands) % bands;
        const b1 = (b0 + 1) % bands;
        const frac = phase * bands - Math.floor(phase * bands);
        const local = bandAmp[b0] * (1 - frac) + bandAmp[b1] * frac;
        const wave = Math.abs((timeData[(i * 5) % timeData.length] - 128) / 128);
        const value = Math.min(1, rms * 2.4 + local * 0.85 + wave * (0.35 + rms * 1.4));
        smooth[i] += (value - smooth[i]) * 0.34;
      }
      transient *= 0.9;
      const target = Math.min(1, Math.max(rms * 3.4, transient));
      viewEnergy += (target - viewEnergy) * 0.16;
    } else {
      transient *= 0.9;
      viewEnergy += (transient - viewEnergy) * 0.1;
    }

    if (ctx && pendingFx.length) {
      const audioNow = ctx.currentTime;
      let fired = 0;
      for (let i = pendingFx.length - 1; i >= 0; i--) {
        if (pendingFx[i].at <= audioNow) {
          if (fired < 5 && audioNow - pendingFx[i].at < 0.14) emitFx(pendingFx[i].kind);
          pendingFx.splice(i, 1);
          fired++;
        }
      }
    }

    if (transport.playing) {
      const name = currentChord().name;
      if (name !== shownChord) {
        if (now - shockStamp > 280) {
          shockwaves.push({ t: now, color: ['208,140,69', '91,123,158', '212,165,165'][shockColor % 3] });
          shockColor++;
          shockStamp = now;
          poke(0.24);
        }
        shownChord = name;
      }
    } else {
      shownChord = '';
    }

    const maxLen = 46 + viewEnergy * 40;
    const tickR = baseR + 30 + maxLen;

    g.save();
    g.translate(frameCx, frameCy);
    g.rotate(t * 0.05);
    g.strokeStyle = 'rgba(91,123,158,0.28)';
    g.lineWidth = 1;
    for (let i = 0; i < 72; i++) {
      const angle = (i / 72) * Math.PI * 2;
      const inner = tickR;
      const outer = inner + (i % 6 === 0 ? 12 : 5);
      g.beginPath();
      g.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
      g.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
      g.stroke();
    }
    g.restore();

    g.lineCap = 'round';
    for (let i = 0; i < smooth.length; i++) {
      const shaped = Math.pow(smooth[i], 0.72);
      const idle = 0.05 + 0.03 * Math.sin(t * 0.85 + i * 0.2);
      const amp = Math.min(1, Math.max(shaped, idle));
      const angle = (i / smooth.length) * Math.PI * 2 - Math.PI / 2;
      const len = 8 + amp * maxLen;
      const r0 = baseR + 8;
      g.strokeStyle = mixColor(i / (smooth.length - 1), Math.min(1, 0.28 + amp));
      g.lineWidth = 1.6 + amp * 1.5;
      g.beginPath();
      g.moveTo(frameCx + Math.cos(angle) * r0, frameCy + Math.sin(angle) * r0);
      g.lineTo(frameCx + Math.cos(angle) * (r0 + len), frameCy + Math.sin(angle) * (r0 + len));
      g.stroke();
    }

    if (transport.playing) {
      g.beginPath();
      g.strokeStyle = 'rgba(208,140,69,0.85)';
      g.lineWidth = 2;
      g.arc(frameCx, frameCy, baseR - 18, -Math.PI / 2, -Math.PI / 2 + transport.position() * Math.PI * 2);
      g.stroke();
    }

    g.beginPath();
    g.strokeStyle = 'rgba(212,165,165,0.18)';
    g.lineWidth = 1;
    g.arc(frameCx, frameCy, baseR + 4, 0, Math.PI * 2);
    g.stroke();

    const waveAmp = 15 + viewEnergy * 36;
    drawPolar(timeData, baseR * 0.6, waveAmp, 'rgba(212,165,165,0.88)', 1.7, 0, 'rgba(91,123,158,0.055)');
    drawPolar(timeData, baseR * 0.6, waveAmp * 0.78, 'rgba(91,123,158,0.55)', 1.15, 20, null);

    const orbR = baseR * (0.34 + viewEnergy * 0.08);
    const orb = g.createRadialGradient(frameCx, frameCy, 0, frameCx, frameCy, orbR);
    orb.addColorStop(0, 'rgba(244,238,232,' + (0.08 + viewEnergy * 0.14) + ')');
    orb.addColorStop(0.45, 'rgba(212,165,165,' + (0.08 + viewEnergy * 0.16) + ')');
    orb.addColorStop(1, 'rgba(20,23,26,0)');
    g.fillStyle = orb;
    g.beginPath();
    g.arc(frameCx, frameCy, orbR, 0, Math.PI * 2);
    g.fill();

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const wave = shockwaves[i];
      const u = (now - wave.t) / 1500;
      if (u >= 1) {
        shockwaves.splice(i, 1);
        continue;
      }
      g.beginPath();
      g.arc(frameCx, frameCy, 36 + u * baseR * 1.35, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + wave.color + ',' + ((1 - u) * 0.38).toFixed(3) + ')';
      g.lineWidth = 1.4;
      g.stroke();
    }

    const ringOuter = frameCy + tickR + 18;
    const baseY = clamp((ringOuter + stageBox.bottom - 6) / 2, ringOuter, stageBox.bottom - 14);
    g.beginPath();
    const points = timeData || [];
    const count = points.length || 128;
    for (let i = 0; i < count; i++) {
      const sample = points.length ? (points[i] - 128) / 128 : Math.sin(t * 2 + i * 0.08) * 0.12;
      const x = (i / (count - 1)) * viewW;
      const y = baseY + sample * (10 + viewEnergy * 34);
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    const stroke = g.createLinearGradient(0, baseY, viewW, baseY);
    const alpha = 0.28 + viewEnergy * 0.6;
    stroke.addColorStop(0, 'rgba(91,123,158,0)');
    stroke.addColorStop(0.18, 'rgba(91,123,158,' + alpha + ')');
    stroke.addColorStop(0.5, 'rgba(212,165,165,' + alpha + ')');
    stroke.addColorStop(0.82, 'rgba(208,140,69,' + (alpha * 0.9) + ')');
    stroke.addColorStop(1, 'rgba(208,140,69,0)');
    g.strokeStyle = stroke;
    g.lineWidth = 1.5;
    g.stroke();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.dust) {
        if (p.life <= 0 || p.y < -12) particles[i] = makeDust(false);
      } else if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }

    g.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      g.fillStyle = 'rgba(' + p.color + ',' + (p.life * (p.dust ? 0.4 : 0.8)).toFixed(3) + ')';
      g.beginPath();
      g.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      g.fill();
    }
    g.globalCompositeOperation = 'source-over';

    for (let i = ripples.length - 1; i >= 0; i--) {
      const ripple = ripples[i];
      const u = (now - ripple.t) / 680;
      if (u >= 1) {
        ripples.splice(i, 1);
        continue;
      }
      g.beginPath();
      g.arc(ripple.x, ripple.y, 5 + u * 34, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(' + ripple.color + ',' + ((1 - u) * 0.45).toFixed(3) + ')';
      g.lineWidth = 1.2;
      g.stroke();
    }

    const vignette = g.createRadialGradient(frameCx, frameCy, Math.min(viewW, viewH) * 0.2, frameCx, frameCy, Math.max(viewW, viewH) * 0.72);
    vignette.addColorStop(0, 'rgba(20,23,26,0)');
    vignette.addColorStop(1, 'rgba(20,23,26,0.55)');
    g.fillStyle = vignette;
    g.fillRect(0, 0, viewW, viewH);
  }

  // 渲染循环，和音频调度分开
  function frame(now) {
    try {
      draw(now);
      syncKeys();
      syncHud();
    } catch (err) {
      if (!frame.logged) {
        frame.logged = true;
        console.error(err);
      }
    }
    requestAnimationFrame(frame);
  }

  buildPiano();
  resize();
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(() => { resize(); });
    observer.observe(stage);
  }
  requestAnimationFrame(frame);
  gate.focus();

  gate.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    bootFromGesture();
  });
  gate.addEventListener('keydown', (e) => {
    if (e.code !== 'Enter' && e.code !== 'Space') return;
    e.preventDefault();
    e.stopPropagation();
    bootFromGesture();
  });

  btnAurora.addEventListener('click', () => toggleSong('aurora'));
  btnHarbor.addEventListener('click', () => toggleSong('harbor'));
  btnGolden.addEventListener('click', () => toggleSong('golden'));
  btnMystery.addEventListener('click', () => toggleSong('mystery'));
  btnStop.addEventListener('click', () => { if (audioReady) transport.stop(); });
  document.querySelectorAll('[data-tone]').forEach((button) => {
    button.addEventListener('click', () => {
      currentTone = button.dataset.tone;
      document.querySelectorAll('[data-tone]').forEach((item) => {
        const on = item === button;
        item.classList.toggle('is-live', on);
        item.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  });
  volumeEl.addEventListener('input', () => setVolume(volumeEl.value));
  spaceEl.addEventListener('input', () => setSpace(spaceEl.value));

  pianoKeys.addEventListener('pointerdown', (e) => {
    if (!audioReady) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const key = e.target.closest('.key');
    if (!key) return;
    e.preventDefault();
    try { pianoKeys.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const note = key.dataset.note;
    pointerNote.set(e.pointerId, note);
    manualOn(note, 'p' + e.pointerId);
  });
  pianoKeys.addEventListener('pointermove', (e) => {
    if (!pointerNote.has(e.pointerId)) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const key = el && el.closest ? el.closest('.key') : null;
    const note = key ? key.dataset.note : null;
    const prev = pointerNote.get(e.pointerId);
    if (note === prev) return;
    if (prev) manualOff(prev, 'p' + e.pointerId);
    pointerNote.set(e.pointerId, note);
    if (note) manualOn(note, 'p' + e.pointerId);
  });
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  pianoKeys.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (!audioReady) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') {
      const field = e.target.closest && e.target.closest('button, input, a, [role="button"]');
      if (field) return;
      e.preventDefault();
      if (transport.playing) transport.stop();
      else toggleSong(lastSongId || 'aurora');
      return;
    }
    const note = KEY_TO_NOTE[e.code];
    if (!note) return;
    e.preventDefault();
    manualOn(note, 'k' + e.code);
  });
  window.addEventListener('keyup', (e) => {
    const note = KEY_TO_NOTE[e.code];
    if (note) manualOff(note, 'k' + e.code);
  });
  window.addEventListener('blur', releaseAllManual);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAllManual();
  });
  document.addEventListener('pointerdown', () => {
    if (ctx && ctx.state === 'suspended') ctx.resume();
  });
})();
</script>
</body>
</html>
